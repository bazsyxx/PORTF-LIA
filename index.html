<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazsyxx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg"></canvas>
<div class="glow"></div>
<div class="grain"></div>
<div class="vig"></div>

<div id="enter">
  <div class="enter-inner">
    <span class="line"></span>
    <span class="txt">Kattints a belépéshez</span>
    <span class="line"></span>
  </div>
</div>

<main id="page">
  <section class="card" id="card">
    <div class="shine"></div>
    <div class="banner"><div class="banner-img"></div></div>

    <div class="top">
      <div class="avatar-wrap r" style="--d:.15s">
        <div class="ring"></div>
        <div class="avatar"></div>
        <span class="status"></span>
      </div>
    </div>

    <div class="body">
      <div class="namerow r" style="--d:.25s">
        <h1>Bazsyxx</h1>
        <span class="tag">
          <svg viewBox="0 0 24 24" width="14" height="14"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9a9a9a"/></linearGradient></defs><path d="M13.5 1 4 13.5h6.2L9 23l10-13.2h-6.4z" fill="url(#g)"/></svg>
          LEAK
        </span>
      </div>
      <p class="sub r" style="--d:.35s"><span id="type"></span><b class="caret"></b></p>

      <div class="box r" style="--d:.5s">
        <h2>Rólam</h2>
        <p>Sziasztok, Bazsyxx vagyok. Ide jön majd a bemutatkozásom, amit később átírok a sajátomra.</p>
      </div>

      <div class="box spot r" style="--d:.65s">
        <h2>Spotify-on hallgatom</h2>
        <div class="sp">
          <div class="cover"></div>
          <div class="info">
            <b>Run It! (feat. Juelz Santana)</b>
            <span>Chris Brown, Juelz Santana</span>
            <div class="prog"><em id="t1">0:00</em><div class="bar"><i id="fill"></i></div><em id="t2">0:00</em></div>
          </div>
        </div>
      </div>

      <div class="socials r" style="--d:.8s">
        <a href="#">Discord<em>↗</em></a>
        <a href="#">GitHub<em>↗</em></a>
      </div>

      <div class="views r" style="--d:.95s">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="views">0</span>
      </div>
    </div>
  </section>
</main>

<audio id="song" src="assets/runit.mp3" loop preload="auto"></audio>
<script src="script.js"></script>
</body>
</html>
