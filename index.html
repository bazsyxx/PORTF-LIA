<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazsyxx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg"></canvas>
<div class="glow"></div>
<div class="grain"></div>
<div class="vig"></div>

<div id="enter">
  <div class="enter-inner">
    <span class="line"></span>
    <span class="txt">Kattints a belépéshez</span>
    <span class="line"></span>
  </div>
</div>

<main id="page">
  <section class="card" id="card">
    <div class="shine"></div>
    <div class="banner"><div class="banner-img"></div></div>

    <div class="top">
      <div class="avatar-wrap r" style="--d:.15s">
        <div class="ring"></div>
        <div class="avatar"></div>
        <span class="status"></span>
      </div>
    </div>

    <div class="body">
      <div class="namerow r" style="--d:.25s">
        <h1>Bazsyxx</h1>
        <span class="tag">
          <svg viewBox="0 0 24 24" width="14" height="14"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9a9a9a"/></linearGradient></defs><path d="M13.5 1 4 13.5h6.2L9 23l10-13.2h-6.4z" fill="url(#g)"/></svg>
          LEAK
        </span>
      </div>
      <p class="sub r" style="--d:.35s"><span id="type"></span><b class="caret"></b></p>

      <div class="box r" style="--d:.5s">
        <h2>Rólam</h2>
        <p>Sziasztok, Bazsyxx vagyok. Ide jön majd a bemutatkozásom, amit később átírok a sajátomra.</p>
      </div>

      <div class="box links r" style="--d:.65s">
        <h2>Linkek</h2>
        <a href="#"><span>Discord</span><em>→</em></a>
        <a href="#"><span>GitHub</span><em>→</em></a>
      </div>

      <a class="btn r" style="--d:.8s" href="#">Üzenet küldése</a>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
